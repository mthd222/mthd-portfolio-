<!doctype html>
<!--
  Source for public/og-image.png, the 1200x630 preview shown when the site is
  shared. The text here is typed in by hand, so update it when resume.json
  changes, then re-render from the project root:

    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=4000 \
      --screenshot=public/og-image.png scripts/og-image.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Share image</title>
    <style>
      @font-face {
        font-family: "Martian Mono";
        src: url("../node_modules/@fontsource-variable/martian-mono/files/martian-mono-latin-wdth-normal.woff2") format("woff2");
        font-weight: 100 800;
        font-stretch: 75% 112.5%;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url("../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wdth-normal.woff2") format("woff2");
        font-weight: 400 700;
        font-stretch: 75% 100%;
      }
      :root {
        --ground: #12272e;
        --ink: #eeedff;
        --muted: #a9babf;
        --fixed: #12272e;
        --tcp: #e7e6ff;
        --udp: #daeeff;
        --http: #e4ffc7;
        --icmp: #fce0ff;
        --smb: #feffd0;
        --syn: #c9cbd3;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: var(--ground);
        color: var(--ink);
        font-family: "Instrument Sans", sans-serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }
      /* Dimmed on the left, where the name and the sentence sit. */
      svg.map {
        position: absolute;
        inset: 0;
        mask-image: linear-gradient(100deg, rgb(0 0 0 / 0.4) 50%, #000 78%);
      }
      .frame {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 46px 60px 44px;
      }
      .mono { font-family: "Martian Mono", monospace; font-stretch: 75%; }

      .top { display: flex; align-items: center; justify-content: space-between; }
      .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
      .mark { display: grid; gap: 4px; width: 40px; height: 40px; padding: 8px 7px; border-radius: 8px; background: #0a191e; border: 1px solid #315059; }
      .mark i { border-radius: 2px; }
      .site { font-size: 22px; font-weight: 500; color: var(--muted); }

      .middle { display: grid; grid-template-columns: 1fr 440px; gap: 56px; align-items: center; }
      .name { font-size: 118px; font-weight: 800; line-height: 0.92; }
      .row { display: flex; }
      .row + .row { margin-top: 16px; }
      .cell { display: flex; flex-direction: column; align-items: center; width: 1ch; }
      .glyph { height: 0.92em; }
      .byte {
        width: calc(100% - 5px);
        margin-top: 9px;
        padding: 4px 0;
        border-radius: 4px;
        background: var(--tcp);
        color: var(--fixed);
        font-size: 19px;
        font-weight: 500;
        line-height: 1.3;
        text-align: center;
      }
      .cell.space .byte { background: var(--syn); }

      .packets { border-radius: 8px; overflow: hidden; }
      .packet {
        display: grid;
        grid-template-columns: 118px 1fr;
        align-items: center;
        gap: 12px;
        min-height: 68px;
        padding: 10px 18px;
        color: var(--fixed);
        font-size: 22px;
        line-height: 1.25;
      }
      .packet b { font-weight: 700; }
      .packet strong { display: block; font-weight: 700; }

      .lead { max-width: 1040px; font-size: 31px; font-weight: 500; line-height: 1.28; }
    </style>
  </head>
  <body>
    <svg class="map" width="1200" height="630" viewBox="0 0 1200 630" aria-hidden="true"></svg>

    <div class="frame">
      <div class="top">
        <div class="brand mono">
          <span class="mark">
            <i style="background: var(--tcp)"></i>
            <i style="background: var(--http)"></i>
            <i style="background: var(--icmp)"></i>
          </span>
          mthd222
        </div>
        <div class="site mono">www.mthd222.in</div>
      </div>

      <div class="middle">
        <div class="name mono" id="name"></div>
        <div class="packets">
          <div class="packet" style="background: var(--http)"><b>Now</b><span>Cyber Security Intern, SOC and XDR</span></div>
          <div class="packet" style="background: var(--smb)"><b>Degree</b><span>MCA, CGPA 9.56 / 10<strong>Silver Medalist</strong></span></div>
          <div class="packet" style="background: var(--icmp)"><b>Published</b><span>IJRASET, Mar 2026</span></div>
          <div class="packet" style="background: var(--udp)"><b>Based in</b><span>Bengaluru, India</span></div>
        </div>
      </div>

      <p class="lead">
        I set up detection on Wazuh, and I test web apps and networks the way an attacker would.
      </p>
    </div>

    <script>
      // The name as bytes, the same way the site's hero draws it.
      const nameEl = document.getElementById('name')
      for (const row of ['MILAN ', 'TEJ H D']) {
        const rowEl = document.createElement('div')
        rowEl.className = 'row'
        for (const char of row) {
          const cell = document.createElement('span')
          cell.className = char === ' ' ? 'cell space' : 'cell'
          const glyph = document.createElement('span')
          glyph.className = 'glyph'
          glyph.textContent = char === ' ' ? ' ' : char
          const byte = document.createElement('span')
          byte.className = 'byte'
          byte.textContent = char.charCodeAt(0).toString(16).padStart(2, '0')
          cell.append(glyph, byte)
          rowEl.append(cell)
        }
        nameEl.append(rowEl)
      }

      // A still of the site's background map. Seeded, so it renders the same every time.
      let seed = 222
      const random = () => {
        seed = (seed + 0x6d2b79f5) | 0
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed)
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296
      }
      const PITCH = 30
      const CELL = 150
      const snap = (v) => Math.round(v / PITCH) * PITCH + 0.5
      const cols = Math.ceil(1200 / CELL)
      const rows = Math.ceil(630 / CELL)
      const grid = Array.from({ length: rows }, () => Array(cols).fill(null))
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (random() > 0.62) continue
          grid[r][c] = {
            x: snap(c * CELL + PITCH + random() * (CELL - 2 * PITCH)),
            y: snap(r * CELL + PITCH + random() * (CELL - 2 * PITCH)),
          }
        }
      }
      const edges = []
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const node = grid[r][c]
          if (!node) continue
          const right = grid[r][c + 1] || grid[r][c + 2]
          const below = grid[r + 1]?.[c] || grid[r + 2]?.[c]
          if (right) edges.push([node, { x: right.x, y: node.y }, right])
          if (below) edges.push([node, { x: node.x, y: below.y }, below])
        }
      }

      const SIGNALS = ['#b9b6ff', '#9fd2ff', '#c5f58f', '#f3d999', '#f3b3fb']
      const parts = []
      for (let x = PITCH; x < 1200; x += PITCH) {
        for (let y = PITCH; y < 630; y += PITCH) {
          parts.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="#eeedff" opacity="0.16"/>`)
        }
      }
      for (const [a, corner, b] of edges) {
        parts.push(
          `<path d="M${a.x} ${a.y}L${corner.x} ${corner.y}L${b.x} ${b.y}" fill="none" stroke="#eeedff" stroke-opacity="0.13"/>`,
        )
      }
      for (const node of grid.flat().filter(Boolean)) {
        parts.push(
          `<rect x="${node.x - 3}" y="${node.y - 3}" width="6" height="6" fill="#12272e" stroke="#eeedff" stroke-opacity="0.42"/>`,
        )
      }
      edges.forEach(([a, corner], i) => {
        if (i % 3) return
        const horizontal = corner.y === a.y
        const length = horizontal ? corner.x - a.x : corner.y - a.y
        if (Math.abs(length) < 50) return
        const at = 0.3 + random() * 0.5
        const x = horizontal ? a.x + length * at : a.x
        const y = horizontal ? a.y : a.y + length * at
        const tail = 18 * Math.sign(length)
        const color = SIGNALS[i % SIGNALS.length]
        parts.push(
          `<path d="M${horizontal ? x - tail : x} ${horizontal ? y : y - tail}L${x} ${y}" stroke="${color}" stroke-width="2" stroke-linecap="round" opacity="0.8"/>`,
          `<rect x="${x - 2}" y="${y - 2}" width="4" height="4" fill="${color}" opacity="0.8"/>`,
        )
      })
      document.querySelector('svg.map').innerHTML = parts.join('')
    </script>
  </body>
</html>
